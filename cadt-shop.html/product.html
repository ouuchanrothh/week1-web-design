<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADT Shop - Product Catalog</title>

    <style>
        table {
            width: 80%; 
            border-collapse: collapse; 
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #ddd; 
            padding: 8px; 
            text-align: left;
        }
        th {
            background-color: #f2f2f2; 
            font-weight: bold;
        }
        img {
            width: 50px; 
            height: auto;
        }
    </style>
</head>
<body>
    <h1>Welcome to CADT Shop!</h1>
    <h2>Product Catalog</h2>

    <table>
        <thead>
            <tr>
                <th>Product Name</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>In Stock</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>CRD Book</td>
                <td>$10</td>
                <td>5</td>
                <td>YES</td>
            </tr>
            <tr>
                <td>CADT Polo</td>
                <td>$12</td>
                <td>50</td>
                <td>YES</td>
            </tr>
            <tr>
                <td>CADT Mouse</td>
                <td>$100</td>
                <td>3</td>
                <td>NO</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
