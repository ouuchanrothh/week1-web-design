<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exercise 3</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            height: 100vh;

            display: flex;
            flex-direction: column;

            gap: 1rem;
            padding: 1rem;
        }

        header {
            background: #1e90ff;
            color: white;

            height: 3rem;
            padding: 1rem;

            border-radius: 0.5rem;

            flex-shrink: 0;
        }

        .content {
            display: flex;

            gap: 1rem;

            flex-grow: 1;
            min-height: 0;
        }

        main {
            background: #3cb371;

            flex-grow: 1;

            display: flex;
            flex-wrap: wrap;

            align-content: flex-start;

            gap: 1rem;
            padding: 1rem;

            border-radius: 0.5rem;
        }

        .item {
            background: #2f8d59;
            color: white;

            width: 3rem;
            height: 3rem;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 0.5rem;
        }

        aside {
            background: #ff6347;
            color: white;

            width: 4rem;

            padding: 1rem;

            border-radius: 0.5rem;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        footer {
            background: #4169e1;
            color: white;

            height: 3rem;
            padding: 1rem;

            border-radius: 0.5rem;

            flex-shrink: 0;
        }

    </style>
</head>

<body>

    <div class="container">

        <header>
            header
        </header>

        <div class="content">

            <main>

                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>

                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>

                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>

            </main>

            <aside>
                sidebar
            </aside>

        </div>

        <footer>
            footer
        </footer>

    </div>

</body>
</html>
