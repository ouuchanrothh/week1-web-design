<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>

      body{
        margin: 0;
        padding: 0;
      }
  
      .main {
        height: 100vh;
        background: #25384B;
        display: flex;
        gap: 5em;
        padding: 3em;
        box-sizing: border-box;
      }

      .left-section {
        background: #A3CFCC;
        flex-grow: 1.5;
        display: flex;
        justify-content: center;
        align-items: center;
      
      }

      .right-section {
        background: #F7CFB6;
        flex-grow: 1;
        width: 12em;
        display: flex;
        flex-direction: column;
        gap: 1em;
        padding: 1em;
        box-sizing: border-box;
       
      }

      .item {
        background: #86C2DE;
      }

      .item:first-child {
        height: 100px;
        flex-shrink: 0; 
      }

      .item:not(:first-child) {
        flex-grow: 1;
      }
 
    </style>
  </head>
  <body>
    <div class="main">
      <section class="left-section"></section>
      <section class="right-section">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
      </section>
    </div>
  </body>
</html>
